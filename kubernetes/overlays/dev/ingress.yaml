---
apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: api-v1
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: sweetrpg-entitlements-strip-prefix-v1@kubernetescrd
    kubernetes.io/ingress.class: traefik

spec:
  ingressClassName: traefik
  rules:
    - host: dev.sweetrpg.com
      http:
        paths:
          # /0 is always latest (api-v0 Service); /1 is pinned to api-v1.
          - pathType: Prefix
            path: /api/0/entitlements
            backend:
              service:
                name: api-v0
                port:
                  name: http
          - pathType: Prefix
            path: /api/1/entitlements
            backend:
              service:
                name: api-v1
                port:
                  name: http
          # POST /webhooks/stripe is served under both prefixes above. It is the one public
          # route: the service authenticates it by Stripe signature, not a user token.
  tls:
    - hosts:
        - dev.sweetrpg.com
      secretName: sweetrpg-dev-tls
