---
# Placeholder: the Stripe item is populated in Akeyless by a human (no values live in this repo).
# The deployment references api-stripe as optional, so pods start before the item exists.
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: entitlements-api-stripe

spec:
  refreshInterval: 12h
  secretStoreRef:
    name: akeyless
    kind: ClusterSecretStore
  target:
    name: api-stripe
    creationPolicy: Owner
  dataFrom:
    # Expected keys: STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET.
    - extract:
        key: /pilgrimage/dev/entitlements/stripe
