---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: entitlements-api-db

spec:
  refreshInterval: 12h
  secretStoreRef:
    name: akeyless
    kind: ClusterSecretStore
  target:
    name: api-db
    creationPolicy: Owner
    template:
      data:
        # Built from the Akeyless password so the URI never gets a second copy of it.
        DB_URI: "mongodb+srv://entitlements-api:{{ .DB_PASSWORD | urlquery }}@cluster0.z9nxg.mongodb.net/sweetrpg-entitlements?retryWrites=true&w=majority"
  dataFrom:
    - extract:
        key: /sweetrpg/entitlements/api/db
