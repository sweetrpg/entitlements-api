---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: entitlements-api-cache

spec:
  refreshInterval: 12h
  secretStoreRef:
    name: akeyless
    kind: ClusterSecretStore
  target:
    name: api-cache
    creationPolicy: Owner
  dataFrom:
    # Provides REDIS_PASS for the Valkey ACL auth enabled in every namespace.
    - extract:
        key: /sweetrpg/entitlements/cache/auth
