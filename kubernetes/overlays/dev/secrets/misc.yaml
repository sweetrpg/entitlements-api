---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: entitlements-api-misc

spec:
  refreshInterval: 12h
  secretStoreRef:
    name: akeyless
    kind: ClusterSecretStore
  target:
    name: api-misc
    creationPolicy: Owner
  dataFrom:
    # Expects SERVICE_TOKENS as "name=token,name=token" (tokens 32+ characters, see config.go).
    - extract:
        key: /sweetrpg/entitlements/api/misc
