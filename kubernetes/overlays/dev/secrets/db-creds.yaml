---
apiVersion: external-secrets.io/v1
kind: ExternalSecret

metadata:
  name: entitlements-api-db-credentials

spec:
  refreshInterval: 12h
  secretStoreRef:
    name: akeyless
    kind: ClusterSecretStore
  target:
    name: entitlements-api-db-credentials
    template:
      metadata:
        labels:
          atlas.mongodb.com/type: credentials
    creationPolicy: Owner
  dataFrom:
    # Same Akeyless item api-db reads, so the Atlas user and the app's DB_URI share one password.
    # The Atlas Operator requires the key to be literally "password".
    - extract:
        key: /sweetrpg/entitlements/api/db
      rewrite:
        - regexp:
            source: "DB_PASSWORD"
            target: "password"
