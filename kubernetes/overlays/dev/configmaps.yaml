---
apiVersion: v1
kind: ConfigMap

metadata:
  name: api-env

data:
  ENV: dev
  AUTH_API_URL: http://api-v1.sweetrpg-auth.svc.cluster.local:8000
  USERS_API_URL: http://api-v1.sweetrpg-users.svc.cluster.local:8000
  # Namespace cache Service (support/infrastructure entitlements/cache, one per namespace).
  REDIS_HOST: cache.sweetrpg-entitlements.svc.cluster.local
  REDIS_PORT: "6379"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo-distributor.observability.svc.cluster.local:4318/
