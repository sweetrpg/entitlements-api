---
apiVersion: v1
kind: ConfigMap

metadata:
  name: api-env

data:
  ENV: local
  AUTH_API_URL: http://api-v1.sweetrpg-auth.svc.cluster.local:8000
  USERS_API_URL: http://api-v1.sweetrpg-users.svc.cluster.local:8000
  REDIS_HOST: cache.sweetrpg-entitlements.svc.cluster.local
  REDIS_PORT: "6379"
  # Landing page until billing pages exist in a frontend.
  STRIPE_CHECKOUT_SUCCESS_URL: http://sweetrpg.local/
  STRIPE_CHECKOUT_CANCEL_URL: http://sweetrpg.local/
  STRIPE_PORTAL_RETURN_URL: http://sweetrpg.local/
  # Same rate-limit posture as auth-api.
  RATE_LIMIT_CHEAP: "1200"
  RATE_LIMIT_CHEAP_WINDOW_SECONDS: "60"
  RATE_LIMIT_STANDARD: "300"
  RATE_LIMIT_STANDARD_WINDOW_SECONDS: "60"
