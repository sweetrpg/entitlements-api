---
apiVersion: v1
kind: Service

metadata:
  name: api-v0

spec:
  # Alias for "latest": the public /api/0 route and any caller that wants latest-not-pinned targets
  # this Service. Repoint the selector's version at v2 when one ships; api-v1 keeps selecting v1.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: entitlements-api
    app.kubernetes.io/version: v1
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8000
      targetPort: http
