name: Prepare Release

permissions:
  contents: write
  pull-requests: write

on:
  workflow_dispatch:

jobs:
  prepare:
    uses: sweetrpg/github-actions/.github/workflows/go-prepare-release.yaml@master
    with:
      # 0 until an Entitlements project board exists; set to its number once created.
      project-number: 0
    secrets: inherit
