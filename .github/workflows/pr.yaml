name: PR Validation

on:
  pull_request:
    branches:
      - master
      - develop

permissions:
  contents: write

jobs:
  validate:
    uses: sweetrpg/github-actions/.github/workflows/go-ci.yaml@master
    with:
      publish-coverage: false
      mongodb-version: "7.0"
      test-env: '{"DB_URI": "mongodb://localhost:27017/entitlements-api-ci"}'
    secrets: inherit
